worker_processes auto;
pid /run/nginx.pid;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
    ssl_prefer_server_ciphers on;

    # Hide server info
    server_tokens off;
    more_clear_headers Server;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Esquema efetivo da requisicao: se um proxy upstream ja terminou o TLS e
    # enviou X-Forwarded-Proto, respeitamos esse valor (a conexao pode chegar
    # aqui pela porta 80); caso contrario usamos o $scheme desta conexao.
    # E o que garante que os links saiam como https quando XFP=https, mesmo
    # com a comunicacao entrando via HTTP/80.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        "~*^https$" https;
        "~*^http$"  http;
    }

    # Real client IP: as faixas confiaveis (set_real_ip_from) vem do .env e sao
    # geradas no boot em /etc/nginx/includes/real_ip.conf.
    include /etc/nginx/includes/real_ip.conf;

    # Upstream backend
    upstream backend {
        server backend:8001;
    }

    # HTTP server. O comportamento (redirect -> HTTPS ou servir a app) e gerado
    # no boot conforme FORCE_TLS, em /etc/nginx/includes/http_mode.conf.
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/includes/http_mode.conf;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/tls/tls.cer;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        root /usr/share/nginx/html;
        index index.html;

        # HSTS: preenchido no boot apenas quando FORCE_TLS=true.
        include /etc/nginx/includes/hsts.conf;

        include /etc/nginx/includes/app_locations.conf;
    }
}
