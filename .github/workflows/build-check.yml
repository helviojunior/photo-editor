# Build de TESTE dos instaladores (o "install check").
#
# A cada push na main (fora mudancas so de documentacao), em pull requests,
# toda segunda-feira e a mao. A versao e a da ULTIMA Release publicada no
# GitHub (0.0.0 se ainda nao houver nenhuma) — o GitHub manda na versao
# (regra 17 do CLAUDE.md); o app exibe X.Y.Z-test+<commit>.
#
# Os instaladores ficam como artefatos do Actions por 3 dias, com o nome
# PhotoEditor-test-vX.Y.Z-<alvo>.<ext>. Nao sao publicados em Release.

name: Build check

on:
  push:
    branches: [main]
    paths-ignore:
      - .gitignore
      - .env.example
      - README.md
      - CLAUDE.md
      - TODO.md
      - LICENSE
      - images/**
  pull_request:
    branches: [main]
    paths-ignore:
      - .gitignore
      - .env.example
      - README.md
      - CLAUDE.md
      - TODO.md
      - LICENSE
      - images/**
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Um push novo cancela o build de teste anterior do mesmo ramo.
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Latest release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          version="$(echo "$tag" | grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' || echo 0.0.0)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest release: ${tag:-none} -> test build $version"

  package:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: test
      ref: ${{ github.sha }}
