# Docker-compose for development/testing

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: photoeditor-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8001"
    extra_hosts:
      - "proxy.local:host-gateway"
    volumes:
      - ./photoeditor_data:/app/data
      # Pasta do projeto de fotos (raw/, project_data/ com o SQLite, deleted/,
      # publicar/). Obrigatoria: sem ela o backend nao sobe.
      - ${PROJECT_DIR:?Set PROJECT_DIR in the root .env (photo project folder)}:/project
      - ./backend:/app
    env_file:
      - .env
    environment:
      TZ: "America/Sao_Paulo"
      DEBUG: "True"
      EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8001"]
    networks:
      - photoeditor-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: "${REACT_APP_BACKEND_URL:-http://localhost:8000}"
    container_name: photoeditor-frontend-dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      TZ: "America/Sao_Paulo"
      REACT_APP_BACKEND_URL: "${REACT_APP_BACKEND_URL:-http://localhost:8000}"
      REACT_APP_BRAND_NAME: "${REACT_APP_BRAND_NAME:-PhotoEditor}"
      REACT_APP_MEDIA_BASE: "${REACT_APP_MEDIA_BASE:-https://media.sec4us.com.br}"
      REACT_APP_BRAND_LOGO: "${REACT_APP_BRAND_LOGO:-}"
      REACT_APP_BRAND_LOGO_DARK: "${REACT_APP_BRAND_LOGO_DARK:-}"
      REACT_APP_BRAND_CONTACT_EMAIL: "${REACT_APP_BRAND_CONTACT_EMAIL:-contato@photoeditor.com.br}"
    depends_on:
      - backend
    networks:
      - photoeditor-net

networks:
  photoeditor-net:
    driver: bridge
